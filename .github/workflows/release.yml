name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Embed repository for in-app updates
        shell: pwsh
        run: |
          Set-Content -Path lecturescribe_build.py -Value "REPO = '${{ github.repository }}'" -Encoding utf8
      - name: Verify syntax
        run: python -m py_compile lecturescribe.pyw lecturescribe_cloud.py lecturescribe_updates.py benchmark_intel.py lecturescribe_providers.py lecturescribe_credentials.py lecturescribe_webex.py lecturescribe_openvino.py prepare_openvino.py
      - name: Service self-tests
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LectureScribe --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all yt_dlp --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all requests --collect-all keyring --collect-all google.genai lecturescribe.pyw
          if (!(Test-Path 'dist/LectureScribe.exe')) { throw 'EXE missing' }
      - name: Package download
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Copy-Item browser-extension dist/browser-extension -Recurse
          New-Item -ItemType Directory dist/browser-extension/firefox
          Copy-Item browser-extension/background.js,browser-extension/bootstrap.js dist/browser-extension/firefox
          Move-Item dist/browser-extension/manifest.firefox.json dist/browser-extension/firefox/manifest.json
          Compress-Archive -Path dist/LectureScribe.exe,dist/README.md,dist/LICENSE,dist/browser-extension -DestinationPath LectureScribe-Windows-x64.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'LectureScribe-Windows-x64.zip').Path)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ('LectureScribe.exe' -notin $names) { throw 'EXE missing from release ZIP' }
            if ('browser-extension/manifest.json' -notin $names -or 'browser-extension/firefox/manifest.json' -notin $names) { throw 'Webex extension missing from release ZIP' }
          }
          finally { $zip.Dispose() }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LectureScribe-Windows-x64
          path: LectureScribe-Windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LectureScribe ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: LectureScribe-Windows-x64.zip
          fail_on_unmatched_files: true
