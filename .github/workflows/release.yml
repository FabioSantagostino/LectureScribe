name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Verify syntax
        run: python -m py_compile lecturescribe.pyw
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LectureScribe --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all yt_dlp lecturescribe.pyw
          if (!(Test-Path 'dist/LectureScribe.exe')) { throw 'EXE missing' }
      - name: Package download
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/LectureScribe.exe,dist/README.md,dist/LICENSE -DestinationPath LectureScribe-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LectureScribe-Windows-x64
          path: LectureScribe-Windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" LectureScribe-Windows-x64.zip --repo "${{ github.repository }}" --title "LectureScribe ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
